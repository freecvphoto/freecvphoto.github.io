<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Free Photo Background Remover</title>
<meta name="description" content="Remove the background from a photo for free and add a new color. Your photo stays on your device.">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <p class="hint"><a href="index.html">All tools</a></p>
  <h1>Photo Background Remover</h1>
  <p class="sub">Works best with photos of a person. Your photo stays on your device.</p>
  <label for="f">Choose a photo</label>
  <input id="f" type="file" accept="image/*">
  <p id="msg" role="status"></p>
  <div id="ctl" hidden>
    <label>Background</label>
    <div class="sw" id="sw"></div>
    <div class="prev"><canvas id="cv"></canvas></div>
    <button class="main" id="dl" type="button">Download PNG</button>
  </div>
</main>
<script src="seg.js"></script>
<script>
const $=s=>document.querySelector(s),cv=$('#cv'),msg=$('#msg');
let person=null,color=null;
function draw(){
  if(!person)return;
  const o=withBg(person,color);cv.width=o.width;cv.height=o.height;
  cv.getContext('2d').drawImage(o,0,0);cv.className=color?'':'chk';
}
swatches($('#sw'),[['Transparent',null],['White','#ffffff'],['Blue','#4a90d9'],['Red','#c62828'],['Green','#2e7d32'],['Gray','#9aa5b1']],c=>{color=c;draw()});
$('#f').onchange=async e=>{
  const f=e.target.files[0];if(!f)return;
  $('#ctl').hidden=true;msg.textContent='Working... the first time can take a minute.';
  try{
    person=await cutout(await loadImage(f));draw();
    $('#ctl').hidden=false;msg.textContent='Done. Pick a background color.';
  }catch(err){console.error(err);msg.textContent='Something went wrong. Check your internet and try a JPG or PNG photo.'}
};
$('#dl').onclick=()=>save(cv,'photo.png','image/png');
</script>
</body>
</html>
